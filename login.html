
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIEND - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 0;
  font-family: Arial, sans-serif;
  background: #edf3ff;
}

.login-box {
  background: white;
  width: 90%;
  max-width: 400px;
  margin: auto;
  padding: 30px 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 5px 20px #0002;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  color: #1877f2;
}

.subtitle {
  color: #777;
  font-size: 18px;
  margin-bottom: 25px;
}

h2 {
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 16px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 17px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #1877f2;
  color: white;
  font-size: 19px;
  font-weight: bold;
}

a {
  color: #1877f2;
  text-decoration: none;
}

.footer {
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">FRIEND</div>

  <p class="subtitle">Connect · Share · Make Friends</p>

  <h2>Login to FRIEND</h2>

  <form id="loginForm">

    <input type="email"
      id="email"
      placeholder="Email Address"
      required>

    <input type="password"
      id="password"
      placeholder="Password"
      required>

    <button type="submit">Login</button>

  </form>

  <p><a href="#" id="forgot">Forgot Password?</a></p>

  <div class="footer">
    New to FRIEND?
    <a href="index.html">Create New Account</a>
  </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Login system এখনো Firebase-এর সঙ্গে যুক্ত করা হয়নি।");
});

document.getElementById("forgot").addEventListener("click", function(e) {
  e.preventDefault();
  alert("Password reset system পরের ধাপে যুক্ত হবে।");
});
</script>

</body>
</html>
